name: Build Kernel Neutron Custom (Safe & Fast)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Pilih Runner Environment'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04
          - self-hosted
      branch:
        description: 'Branch'
        required: true
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'earth_defconfig'
      neutron_version:
        description: 'Pilih Versi Neutron Clang'
        required: true
        default: '10032024 - Clang 19 (Opsi Performa)'
        type: choice
        options:
          - '10032024 - Clang 19 (Opsi Performa)'
          - '05012024 - Clang 18 (Recommended 4.19)'
          - '09092023 - Clang 17/18 (Cadangan Aman)'
          - '29072023 - Clang 17'
          - '11032023 - Clang 16/17'
          - 'latest - Clang 24 (Terbaru)'
      kernelsu_url:
        description: 'Custom KSU URL (Kosongkan untuk skip KSU)'
        required: false
        default: ''
      kernelsu_branch:
        description: 'KSU Branch / Version'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Set Variables
      run: |
        echo "BUILD_TIME=$(date +'%H%M-%d%m%y')" >> $GITHUB_ENV
        echo "ARGS=ARCH=arm64 SUBARCH=arm64 KBUILD_BUILD_USER=DianTk_Modz KBUILD_BUILD_HOST=GitHub-Actions CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl zstd jq

    - name: Setup Neutron Clang
      run: |
        RAW_CHOICE="${{ github.event.inputs.neutron_version }}"
        NEUTRON_VER="${RAW_CHOICE%% *}"
        echo "Mengunduh Neutron Clang: $RAW_CHOICE (Tag: $NEUTRON_VER)"
        mkdir -p neutron-clang
        cd neutron-clang
        curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
        chmod +x antman
        if [ "$NEUTRON_VER" = "latest" ]; then
          ./antman -S
        else
          ./antman -S="$NEUTRON_VER"
        fi
        cd ..
        echo "$PWD/neutron-clang/bin" >> $GITHUB_PATH
        ./neutron-clang/bin/clang --version

    - name: Setup KernelSU
      if: github.event.inputs.kernelsu_url != ''
      run: |
        curl -LSs "${{ github.event.inputs.kernelsu_url }}" | bash -s "${{ github.event.inputs.kernelsu_branch }}"

    - name: Inject Makefile Overrides
      run: |
        inject_flag() {
          local file="$1"
          local flag="$2"
          if [ -e "$file" ]; then
            if ! grep -Fq "$flag" "$file"; then
              printf '\n%s\n' "$flag" >> "$file"
              echo "Injected [$flag] -> $file"
            else
              echo "Sudah ada [$flag] -> $file"
            fi
          else
            echo "Skip (tidak ditemukan): $file"
          fi
        }

        # Flag -O1 aman untuk driver sensitif & inti KSU/SUSFS (menimpa -O3 -funroll-loops dari KCFLAGS)
        SAFE_O1_SUBDIR="subdir-ccflags-y += -O1 -fno-unroll-loops -fno-strict-aliasing -fno-delete-null-pointer-checks"
        SAFE_O1_OBJ="-O1 -fno-unroll-loops -fno-strict-aliasing -fno-delete-null-pointer-checks"

        # 1. Turunkan ke -O1 untuk driver modem MediaTek (pulihkan sinyal di Clang 19+)
        inject_flag "drivers/misc/mediatek/eccci/Makefile" "$SAFE_O1_SUBDIR"
        inject_flag "drivers/misc/mediatek/ccci_util/Makefile" "$SAFE_O1_SUBDIR"
        inject_flag "drivers/misc/mediatek/ccmni/Makefile" "$SAFE_O1_SUBDIR"

        # 2. Turunkan ke -O1 untuk seluruh modul KernelSU & subdirektorinya (selinux, sucompat, dll.)
        inject_flag "drivers/kernelsu/Makefile" "$SAFE_O1_SUBDIR"

        # 3. Turunkan ke -O2 untuk hook VFS/ProcFS/Kernel/Input + -O1 khusus objek inti fs/susfs.o
        inject_flag "fs/Makefile" "ccflags-y += -O2 -fno-unroll-loops -fno-optimize-sibling-calls -mllvm -inline-threshold=50"
        inject_flag "fs/Makefile" "CFLAGS_susfs.o += $SAFE_O1_OBJ"
        inject_flag "fs/proc/Makefile" "ccflags-y += -O2 -fno-unroll-loops -fno-optimize-sibling-calls -mllvm -inline-threshold=50"
        inject_flag "kernel/Makefile" "ccflags-y += -O2 -fno-unroll-loops -fno-optimize-sibling-calls -fno-inline-functions"
        inject_flag "drivers/input/Makefile" "ccflags-y += -O2 -fno-unroll-loops -fno-optimize-sibling-calls -fno-inline-functions"

    - name: Generate Defconfig
      run: |
        make O=out $ARGS ${{ github.event.inputs.defconfig }}

    - name: Compile Kernel
      run: |
        # Flag optimasi -O3 global untuk Cortex-A75/A55 (di-override otomatis oleh Makefile target di atas)
        OPTIMIZATION_FLAGS="-O3 -Wno-error -funroll-loops -fomit-frame-pointer -falign-functions=32 -fno-math-errno -ffinite-math-only -march=armv8.2-a+dotprod -mcpu=cortex-a75 -mtune=cortex-a75"

        make O=out -j$(nproc) $ARGS KCFLAGS="$OPTIMIZATION_FLAGS" || \
        make O=out -j1 $ARGS KCFLAGS="$OPTIMIZATION_FLAGS"

    - name: Check Build Output
      run: |
        echo "=== Verifikasi Override Optimasi ==="
        if ls out/drivers/kernelsu/.*.o.cmd >/dev/null 2>&1; then
          echo "KernelSU flags: $(grep -oE -- '-O[0-3s]' out/drivers/kernelsu/.*.o.cmd | head -n 4 | tr '\n' ' ')"
        fi
        if [ -f out/fs/.susfs.o.cmd ]; then
          echo "SUSFS core flags: $(grep -oE -- '-O[0-3s]' out/fs/.susfs.o.cmd | tr '\n' ' ')"
        fi

        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ] && [ ! -f out/arch/arm64/boot/Image.gz ]; then
          echo "Error: Image.gz-dtb / Image.gz tidak ditemukan. Build kernel gagal."
          exit 1
        else
          echo "Kernel berhasil di-build dengan Optimasi Aman & Cepat."
        fi

    - name: Upload Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Result-${{ env.BUILD_TIME }}-SAFE
        path: |
          out/arch/arm64/boot/Image.gz*
          out/arch/arm64/boot/dts/**/*.dtb
          out/arch/arm64/boot/dts/**/*.gz
          out/arch/arm64/boot/dts/**/*.gz-dtb
        retention-days: 7
