name: Universal Smart Patcher

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch tujuan (otomatis dibuat jika belum ada)'
        required: true
        default: 'main'
        type: string
      patch_urls:
        description: 'Satu atau banyak URL patch, pisahkan dengan spasi/koma/baris baru (GitHub, GitLab, Bitbucket, AOSP, Lore, GDrive, Raw)'
        required: false
        type: string
      allow_rejects:
        description: 'Tetap commit hasil patch & file .rej jika ada hunk yang bentrok'
        required: false
        default: true
        type: boolean
      squash_commits:
        description: 'Gabungkan semua patch menjadi 1 commit (nonaktifkan untuk 1 commit per patch)'
        required: false
        default: true
        type: boolean
      commit_message:
        description: 'Pesan commit (opsional, digunakan jika squash aktif)'
        required: false
        type: string

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare Target Branch
        env:
          INPUT_BRANCH: ${{ inputs.target_branch }}
        run: |
          TARGET="${INPUT_BRANCH:-${{ github.ref_name }}}"
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET"; then
            git checkout -B "$TARGET" "origin/$TARGET"
          else
            echo "Branch '$TARGET' belum ada, membuat branch baru..."
            git checkout -b "$TARGET"
          fi
          echo "TARGET_BRANCH=$TARGET" >> "$GITHUB_ENV"

      - name: Collect & Apply All Patches
        env:
          INPUT_URLS: ${{ inputs.patch_urls }}
          ALLOW_REJECTS: ${{ inputs.allow_rejects }}
          SQUASH_COMMITS: ${{ inputs.squash_commits }}
        run: |
          set -e
          mkdir -p /tmp/queued_patches
          COUNTER=1

          # 1. Kumpulkan patch dari folder lokal patches/ (jika ada di branch)
          shopt -s nullglob
          LOCAL_FILES=(patches/*.patch patches/*.diff)
          if [ ${#LOCAL_FILES[@]} -gt 0 ]; then
            IFS=$'\n' SORTED_LOCAL=($(sort <<<"${LOCAL_FILES[*]}"))
            unset IFS
            for f in "${SORTED_LOCAL[@]}"; do
              DEST="/tmp/queued_patches/$(printf '%03d' $COUNTER)_$(basename "$f")"
              cp "$f" "$DEST"
              sed -i 's/\r$//' "$DEST"
              rm -f "$f"
              COUNTER=$((COUNTER + 1))
            done
          fi

          # 2. Unduh semua patch dari URL (mendukung pemisah spasi, koma, titik koma, dan newline)
          if [ -n "$INPUT_URLS" ]; then
            URLS=$(printf '%s' "$INPUT_URLS" | tr ',;\n\r\t' ' ')
            for raw_input in $URLS; do
              URL="${raw_input%%#*}"
              URL="${URL%/}"
              [ -z "$URL" ] && continue

              IS_BASE64=false
              SLUG=$(basename "$URL" | tr -cd 'a-zA-Z0-9._-' | cut -c1-40)
              [ -z "$SLUG" ] && SLUG="remote"
              OUT_FILE="/tmp/queued_patches/$(printf '%03d' $COUNTER)_${SLUG}.patch"

              if [[ "$URL" =~ github\.com/[^/]+/[^/]+/blob/ ]]; then
                RAW_URL=$(echo "$URL" | sed -E 's|github\.com/([^/]+)/([^/]+)/blob/|raw.githubusercontent.com/\1/\2/|')
              elif [[ "$URL" =~ github\.com/[^/]+/[^/]+/(commit/[0-9a-fA-F]+|pull/[0-9]+)$ ]]; then
                RAW_URL="${URL}.patch"
              elif [[ "$URL" =~ gist\.github\.com/[^/]+/[0-9a-fA-F]+$ ]]; then
                RAW_URL="${URL}/raw"
              elif [[ "$URL" =~ /-/blob/ ]]; then
                RAW_URL=$(echo "$URL" | sed -E 's|/-/blob/|/-/raw/|')
              elif [[ "$URL" =~ /-/commit/[0-9a-fA-F]+$ ]] || [[ "$URL" =~ /-/merge_requests/[0-9]+$ ]]; then
                RAW_URL="${URL}.patch"
              elif [[ "$URL" =~ bitbucket\.org/[^/]+/[^/]+/src/ ]]; then
                RAW_URL=$(echo "$URL" | sed -E 's|/src/|/raw/|')
              elif [[ "$URL" =~ bitbucket\.org/[^/]+/[^/]+/commits/[0-9a-fA-F]+$ ]]; then
                RAW_URL="${URL}/raw"
              elif [[ "$URL" =~ (codeberg\.org|gitea\.)[^/]+/[^/]+/[^/]+/src/ ]]; then
                RAW_URL=$(echo "$URL" | sed -E 's|/src/|/raw/|')
              elif [[ "$URL" =~ (codeberg\.org|gitea\.)[^/]+/[^/]+/[^/]+/(commit/[0-9a-fA-F]+|pulls/[0-9]+)$ ]]; then
                RAW_URL="${URL}.patch"
              elif [[ "$URL" =~ \.googlesource\.com/.+/\+/[0-9a-fA-F]+$ ]]; then
                RAW_URL="${URL}^+!/?format=TEXT"
                IS_BASE64=true
              elif [[ "$URL" =~ lore\.kernel\.org/ ]] && [[ ! "$URL" =~ /raw$ ]]; then
                RAW_URL="${URL}/raw"
              elif [[ "$URL" =~ pastebin\.com/[a-zA-Z0-9]+$ ]]; then
                RAW_URL=$(echo "$URL" | sed -E 's|pastebin\.com/|pastebin.com/raw/|')
              elif [[ "$URL" =~ drive\.google\.com/file/d/([a-zA-Z0-9_-]+) ]]; then
                FILE_ID="${BASH_REMATCH[1]}"
                RAW_URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download"
              else
                RAW_URL="$URL"
              fi

              echo "Mengunduh [$COUNTER]: $RAW_URL"
              if [ "$IS_BASE64" = true ]; then
                if ! curl -fsSL "$RAW_URL" | base64 -d > "$OUT_FILE"; then
                  echo "Error: Gagal mengunduh atau decode base64 dari $URL"
                  exit 1
                fi
              else
                if ! curl -fsSL "$RAW_URL" -o "$OUT_FILE"; then
                  echo "Error: Gagal mengunduh patch dari $URL"
                  exit 1
                fi
              fi

              if [ ! -s "$OUT_FILE" ]; then
                echo "Error: File patch dari $URL kosong."
                exit 1
              fi

              if head -n 15 "$OUT_FILE" | grep -qiE '<!DOCTYPE html|<html'; then
                echo "Error: Tautan $URL menghasilkan halaman HTML, bukan file patch."
                exit 1
              fi

              # Normalisasi CRLF -> LF
              sed -i 's/\r$//' "$OUT_FILE"
              COUNTER=$((COUNTER + 1))
            done
          fi

          # 3. Validasi antrean patch
          PATCH_FILES=(/tmp/queued_patches/*.patch /tmp/queued_patches/*.diff)
          if [ ${#PATCH_FILES[@]} -eq 0 ]; then
            echo "Error: Tidak ada URL patch yang diisi dan tidak ada file di folder patches/."
            exit 1
          fi

          echo "Total patch dalam antrean: ${#PATCH_FILES[@]}"
          BASE_COMMIT=$(git rev-parse HEAD)
          APPLIED_SUMMARY=""

          # 4. Eksekusi patch satu per satu dengan isolasi rollback
          for pfile in "${PATCH_FILES[@]}"; do
            [ -e "$pfile" ] || continue
            PNAME=$(basename "$pfile")
            PBASE="${PNAME%.*}"
            echo "=========================================="
            echo "Menerapkan: $PNAME"
            echo "=========================================="

            # Ambil subjek patch jika format git format-patch, atau gunakan nama file
            PATCH_TITLE=$(grep -m1 '^Subject:' "$pfile" | sed -E 's/^Subject:\s*(\[PATCH[^\]]*\]\s*)?//' || true)
            [ -z "$PATCH_TITLE" ] && PATCH_TITLE="chore: apply $PNAME"

            # Deteksi strip level (-p1 jika standar git diff a/ b/, atau -p0 jika tanpa prefix)
            STRIP_LEVEL="-p1"
            if ! grep -qE '^(---|\+\+\+) (a|b)/' "$pfile"; then
              STRIP_LEVEL="-p0"
            fi

            if patch "$STRIP_LEVEL" --fuzz=3 --forward --batch --no-backup-if-mismatch < "$pfile"; then
              echo "[OK] Berhasil sempurna dengan patch $STRIP_LEVEL"
              APPLIED_SUMMARY="${APPLIED_SUMMARY}- ${PNAME} (clean)\n"
            else
              if [ "$ALLOW_REJECTS" = "true" ]; then
                echo "[WARN] Sebagian hunk gagal dan disimpan ke file .rej"
                # Rename .rej baru agar tidak tertimpa oleh patch berikutnya
                while IFS= read -r rej; do
                  mv "$rej" "${rej}.${PBASE}"
                done < <(find . -name "*.rej" -not -path "./.git/*")
                APPLIED_SUMMARY="${APPLIED_SUMMARY}- ${PNAME} (with .rej conflicts)\n"
              else
                echo "[RETRY] Membersihkan sisa patch ini dan mencoba git apply --3way..."
                git reset --hard HEAD
                git clean -fd
                if git apply "$STRIP_LEVEL" --3way --ignore-whitespace "$pfile"; then
                  echo "[OK] Berhasil dengan git apply --3way"
                  APPLIED_SUMMARY="${APPLIED_SUMMARY}- ${PNAME} (3-way merge)\n"
                else
                  echo "[FAIL] Patch $PNAME gagal diterapkan secara bersih!"
                  exit 1
                fi
              fi
            fi

            # Simpan progress patch ini ke commit sementara agar aman dari reset patch berikutnya
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "$PATCH_TITLE"
            fi
          done

          echo "=========================================="
          echo "RINGKASAN EKSEKUSI PATCH:"
          printf "%b" "$APPLIED_SUMMARY"

          # Tampilkan semua file .rej jika ada
          REJ_FILES=$(find . -name "*.rej*" -not -path "./.git/*")
          if [ -n "$REJ_FILES" ]; then
            echo "=== DAFTAR FILE .REJ YANG PERLU DICEK MANUAL ==="
            echo "$REJ_FILES"
          fi

          # Jika mode squash aktif, kembalikan ke BASE_COMMIT (soft) agar digabung oleh action berikutnya
          if [ "$SQUASH_COMMITS" = "true" ]; then
            git reset --soft "$BASE_COMMIT"
          fi

      - name: Commit & Push Changes (Squash Mode)
        if: ${{ inputs.squash_commits }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "${{ inputs.commit_message || format('feat: apply patches to {0}', env.TARGET_BRANCH) }}"
          branch: ${{ env.TARGET_BRANCH }}

      - name: Push Individual Commits
        if: ${{ !inputs.squash_commits }}
        run: |
          git push origin "$TARGET_BRANCH"
