name: Apply Patch (Copy-Paste) to Custom Branch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Nama branch target (contoh: kernel-4.19, main, dev)'
        required: true
        default: 'main'
        type: string
      patch_content:
        description: 'Paste seluruh isi file .patch di sini'
        required: true
        type: string

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Save Patch Content
        run: |
          # Mengekstrak input patch langsung dari file JSON event agar tidak terkena limit 128KB env
          jq -r '.inputs.patch_content' "$GITHUB_EVENT_PATH" > custom.patch
          echo "Berhasil menyimpan patch ($(wc -l < custom.patch) baris)"

      - name: Apply Patch
        run: |
          if patch -p1 --forward --batch < custom.patch; then
            echo "Patch berhasil diaplikasikan menggunakan patch -p1"
          else
            echo "Fallback: Memproses menggunakan git apply -p1..."
            git apply -p1 --ignore-whitespace custom.patch
          fi
          rm custom.patch

      - name: Commit & Push to Custom Branch
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: apply patch via workflow dispatch"
          branch: ${{ inputs.target_branch }}
