name: Multi-Commit to Single Patch

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repo target (format: owner/repo, kosongkan untuk repo ini)'
        required: false
        default: ''
        type: string
      target_branch:
        description: 'Branch target (kosongkan untuk branch default repo)'
        required: false
        default: ''
        type: string
      commit_hashes:
        description: 'Daftar hash commit (pisahkan dengan spasi atau koma, berurutan)'
        required: true
        type: string
      patch_name:
        description: 'Nama file hasil .patch'
        required: false
        default: 'combined-custom.patch'
        type: string

jobs:
  generate-single-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Parameters
        id: params
        run: |
          REPO="${{ inputs.target_repo }}"
          [ -z "$REPO" ] && REPO="${{ github.repository }}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

          NAME="${{ inputs.patch_name }}"
          [[ "$NAME" != *.patch ]] && NAME="${NAME}.patch"
          echo "filename=$NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.params.outputs.repo }}
          ref: ${{ inputs.target_branch }}
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Combine Multiple Commits into One Patch
        run: |
          mkdir -p output
          OUT_FILE="output/${{ steps.params.outputs.filename }}"
          : > "$OUT_FILE"

          # Ubah pemisah koma atau baris baru menjadi spasi
          HASH_LIST=$(echo "${{ inputs.commit_hashes }}" | tr ',\r\n' ' ')
          COUNT=0

          for HASH in $HASH_LIST; do
            FULL_HASH=$(git rev-parse --verify "${HASH}^{commit}" 2>/dev/null) || {
              echo "Error: Commit '$HASH' tidak ditemukan di ${{ steps.params.outputs.repo }}"
              exit 1
            }

            COUNT=$((COUNT + 1))
            echo "[$COUNT] Menggabungkan: $FULL_HASH - $(git log -1 --pretty=format:'%s' "$FULL_HASH")"
            git format-patch -1 "$FULL_HASH" --stdout >> "$OUT_FILE"
          done

          if [ "$COUNT" -eq 0 ]; then
            echo "Error: Tidak ada hash commit yang diproses."
            exit 1
          fi

          echo "Berhasil menggabungkan $COUNT commit ke $OUT_FILE"
          ls -lh "$OUT_FILE"

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-patch-${{ github.run_number }}
          path: output/*.patch
          if-no-files-found: error
