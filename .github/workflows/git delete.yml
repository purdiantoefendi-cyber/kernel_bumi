name: Hapus Submodule Custom (Multi)

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch tempat submodule berada (Contoh: diantk2)'
        required: true
        type: string
        default: 'diantk2'
      submodule_list:
        description: 'Daftar Submodule (Pisahkan dengan Spasi atau Enter)'
        required: true
        type: string
        default: 'KernelSU-Next SukiSU'

jobs:
  delete-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: ⚙️ Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: 🗑️ Hapus Daftar Submodule & Bersihkan Cache
        env:
          SUBMODULE_LIST_INPUT: ${{ inputs.submodule_list }}
        run: |
          # Membaca daftar input dan memisahkannya (mendukung spasi & baris baru)
          mapfile -t SUBMODULES < <(echo "$SUBMODULE_LIST_INPUT" | tr ' ' '\n' | grep -v '^$')
          
          echo "Ditemukan ${#SUBMODULES[@]} submodule untuk diproses."

          for TARGET in "${SUBMODULES[@]}"; do
            # Bersihkan karakter tersembunyi (\r)
            TARGET=$(echo "$TARGET" | tr -d '\r')
            if [ -z "$TARGET" ]; then continue; fi

            echo "=========================================================="
            echo "Memulai penghapusan: $TARGET"
            echo "=========================================================="
            
            # 1. Hapus dari indeks Git
            git rm -f "$TARGET" || echo "⚠️ Lewati: $TARGET mungkin sudah tidak terdaftar di Git."
            
            # 2. Hapus cache submodule
            rm -rf ".git/modules/$TARGET"
            
            # 3. Hapus sisa konfigurasi
            git config --remove-section "submodule.$TARGET" 2>/dev/null || true
            
            # 4. Hapus folder fisik
            rm -rf "$TARGET"
            
            echo "✅ $TARGET bersih dari sistem."
          done

      - name: 🚀 Commit dan Push Perubahan
        run: |
          BRANCH="${{ inputs.target_branch }}"
          
          if [[ -n $(git status --porcelain) ]]; then
            echo "Mendeteksi perubahan, menyiapkan commit..."
            git add .
            git commit -m "chore: remove selected submodules"
            git push origin "$BRANCH"
            echo "✅ Selesai! Semua submodule yang dipilih berhasil dihapus dari branch $BRANCH."
          else
            echo "ℹ️ Tidak ada perubahan. Submodule tersebut mungkin sudah tidak ada."
          fi
