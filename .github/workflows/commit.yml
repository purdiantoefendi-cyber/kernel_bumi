name: Force Push Commits (Fixed Branch Name)

on:
  workflow_dispatch:

jobs:
  force-apply-commits:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git config --global --add safe.directory '*'

      - name: Proses Cherry-Pick dan Force Push
        run: |
          # 1. Fetch data terbaru
          git fetch origin

          # 2. Pindah ke branch 'Aberuzz' (PENTING: Huruf A Besar)
          #    Kita reset hard agar bersih sebelum ditimpa
          if git show-ref --verify --quiet refs/remotes/origin/Aberuzz; then
            git checkout -B Aberuzz origin/Aberuzz
          else
            # Jika branch belum ada, buat baru dengan nama Aberuzz
            git checkout -b Aberuzz
          fi

          # 3. DAFTAR COMMIT
          COMMITS=(
            "567715762dac5fe99527a030e9c68ec33ae9137b"
            "2989a71f2a78d4233bc396b6db1565c870a08d6a"
            "9872eb37d659b00761f30412d60d02c0a49017a5"
            "34083a8c288744fc24ac04bfbbbc81f1467272ae"
          )

          # 4. Cherry-pick Loop
          for commit in "${COMMITS[@]}"; do
            echo "Applying commit: $commit"
            git cherry-pick --strategy=recursive -X theirs --allow-empty --keep-redundant-commits $commit
          done

          # 5. Push ke branch Aberuzz (A Besar)
          echo "Pushing to origin/Aberuzz..."
          git push origin Aberuzz --force
