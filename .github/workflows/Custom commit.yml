name: Force Push Commits (Custom Repo & Branch)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Pilih Runner Environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-slim
          - self-hosted
      external_repo:
        description: 'URL Repository Eksternal'
        required: true
        type: string
        default: 'https://github.com/purdiantoefendi-cyber/AbrezzPjkt_Earth.git'
      external_branch:
        description: 'Branch di Repo Eksternal yang ingin diambil'
        required: true
        type: string
        default: 'diantk'
      target_branch:
        description: 'Branch Tujuan di Repo Anda'
        required: true
        type: string
        default: 'diantk2'
      commit_hashes:
        description: '[MODE 1] Daftar Hash Commit (Kosongkan jika pakai mode hari)'
        required: false
        type: string
        default: ''
      fetch_days:
        description: '[MODE 2] Ambil dari X hari terakhir (Kosongkan jika pakai mode hash)'
        required: false
        type: string
        default: '7'
      retro_days:
        description: '[OPSIONAL] Mundurkan tanggal commit X hari? (Isi 0 jika tidak perlu)'
        required: false
        type: string
        default: '0'

jobs:
  force-apply-commits:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git config --global --add safe.directory '*'

      - name: Proses Cherry-Pick dan Force Push
        run: |
          EXTERNAL_REPO="${{ inputs.external_repo }}"
          EXTERNAL_BRANCH="${{ inputs.external_branch }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          COMMITS_INPUT="${{ inputs.commit_hashes }}"
          FETCH_DAYS="${{ inputs.fetch_days }}"
          RETRO_DAYS="${{ inputs.retro_days }}"

          # 1. Validasi Input Eksklusif
          if [ -z "$COMMITS_INPUT" ] && [ -z "$FETCH_DAYS" ]; then
            echo "❌ ERROR: Anda harus mengisi salah satu: 'Daftar Hash' ATAU 'Ambil dari X hari'."
            exit 1
          fi

          echo "Mempersiapkan repository eksternal..."
          git remote remove custom_repo 2>/dev/null || true
          git remote add custom_repo "$EXTERNAL_REPO"
          git fetch custom_repo "$EXTERNAL_BRANCH"
          git fetch origin

          # 2. Pindah ke branch target
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi

          # 3. LOGIKA PEMILIHAN COMMIT (Hari vs Hash)
          if [ -n "$COMMITS_INPUT" ]; then
            echo "========================================"
            echo "🔍 MENGGUNAKAN MODE HASH"
            echo "========================================"
            read -r -a COMMITS <<< "$COMMITS_INPUT"
          else
            echo "========================================"
            echo "🔍 MENGGUNAKAN MODE HARI ($FETCH_DAYS hari terakhir)"
            echo "========================================"
            # Ambil hash commit secara otomatis dari X hari terakhir, urutkan dari terlama ke terbaru (--reverse)
            COMMIT_LIST=$(git log --since="$FETCH_DAYS days ago" --reverse --format="%H" custom_repo/"$EXTERNAL_BRANCH")
            read -r -a COMMITS <<< "$COMMIT_LIST"
            
            if [ ${#COMMITS[@]} -eq 0 ] || [ -z "$COMMIT_LIST" ]; then
              echo "❌ Tidak ada commit yang ditemukan dalam $FETCH_DAYS hari terakhir di branch $EXTERNAL_BRANCH."
              exit 0
            fi
            echo "Ditemukan ${#COMMITS[@]} commit yang akan ditarik secara otomatis."
          fi

          SUCCESS_COMMITS=()
          FAILED_COMMITS=()
          TIME_OFFSET=0

          # 4. Loop Eksekusi Cherry-Pick
          for commit in "${COMMITS[@]}"; do
            if [ -n "$commit" ]; then
              echo "----------------------------------------"
              echo "Menerapkan commit: $commit"
              
              if git cherry-pick --strategy=recursive -X theirs --allow-empty --keep-redundant-commits "$commit"; then
                
                # Logika Spoofing Waktu Mundur
                if [ -n "$RETRO_DAYS" ] && [ "$RETRO_DAYS" -gt 0 ]; then
                  PAST_DATE=$(date -d "$RETRO_DAYS days ago + $TIME_OFFSET minutes" --iso-8601=seconds)
                  GIT_AUTHOR_DATE="$PAST_DATE" GIT_COMMITTER_DATE="$PAST_DATE" git commit --amend --no-edit --date="$PAST_DATE"
                  echo "✅ BERHASIL (Mundur ke: $PAST_DATE)"
                else
                  echo "✅ BERHASIL (Tanggal asli dipertahankan)"
                fi
                
                SUCCESS_COMMITS+=("$commit")
                TIME_OFFSET=$((TIME_OFFSET + 1))
              else
                echo "❌ GAGAL: Terjadi konflik/error."
                FAILED_COMMITS+=("$commit")
                git cherry-pick --abort || true
              fi
            fi
          done

          # 5. Laporan Eksekusi
          echo "========================================"
          echo "📊 LAPORAN HASIL CHERRY-PICK"
          echo "✅ Berhasil: ${#SUCCESS_COMMITS[@]}"
          echo "❌ Gagal: ${#FAILED_COMMITS[@]}"
          echo "========================================"

          # 6. Push ke repositori
          echo "Mendorong perubahan ke origin/$TARGET_BRANCH..."
          git push origin "$TARGET_BRANCH" --force
