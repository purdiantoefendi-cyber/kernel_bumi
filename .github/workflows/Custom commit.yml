name: Force Push Commits (Custom Repo & Branch)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Pilih Runner Environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-slim
          - self-hosted
      external_repo:
        description: 'URL Repository Eksternal'
        required: true
        type: string
        default: 'https://github.com/purdiantoefendi-cyber/kernel_bumi.git'
      external_branch:
        description: 'Branch di Repo Eksternal yang ingin diambil'
        required: true
        type: string
        default: 'diantk'
      target_branch:
        description: 'Branch Tujuan di Repo Anda'
        required: true
        type: string
        default: 'diantk2'
      fetch_count:
        description: '[MODE UTAMA] Ambil X commit terakhir (Contoh: 10, 50. Kosongkan jika pakai Hash/Tanggal)'
        required: false
        type: string
        default: ''
      commit_hashes:
        description: '[MODE 2] Daftar Hash Commit (Kosongkan jika pakai Jumlah/Tanggal)'
        required: false
        type: string
        default: ''
      fetch_since:
        description: '[MODE 3] Mulai dari tanggal (Format: YYYY-MM-DD)'
        required: false
        type: string
        default: ''
      fetch_until:
        description: '[MODE 3] Sampai tanggal (Opsional)'
        required: false
        type: string
        default: ''
      retro_days:
        description: '[OPSIONAL] Mundurkan tanggal hasil cherry-pick X hari? (Isi 0 jika tidak perlu)'
        required: false
        type: string
        default: '0'

jobs:
  force-apply-commits:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git config --global --add safe.directory '*'

      - name: Proses Cherry-Pick dan Force Push
        run: |
          EXTERNAL_REPO="${{ inputs.external_repo }}"
          EXTERNAL_BRANCH="${{ inputs.external_branch }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"
          COMMITS_INPUT="${{ inputs.commit_hashes }}"
          FETCH_COUNT="${{ inputs.fetch_count }}"
          FETCH_SINCE="${{ inputs.fetch_since }}"
          FETCH_UNTIL="${{ inputs.fetch_until }}"
          RETRO_DAYS="${{ inputs.retro_days }}"

          if [ -z "$COMMITS_INPUT" ] && [ -z "$FETCH_SINCE" ] && [ -z "$FETCH_COUNT" ]; then
            echo "❌ ERROR: Isi salah satu: Jumlah, Hash, atau Tanggal."
            exit 1
          fi

          echo "Mempersiapkan repository eksternal..."
          git remote remove custom_repo 2>/dev/null || true
          git remote add custom_repo "$EXTERNAL_REPO"
          
          # PERBAIKAN: Fetch origin lebih dulu, lalu fetch branch eksternal ke path spesifik
          git fetch origin
          git fetch custom_repo "$EXTERNAL_BRANCH":refs/remotes/custom_repo/"$EXTERNAL_BRANCH"

          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET_BRANCH"; then
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            git checkout -b "$TARGET_BRANCH"
          fi

          # LOGIKA PEMILIHAN COMMIT
          if [ -n "$FETCH_COUNT" ] && [ "$FETCH_COUNT" -gt 0 ]; then
            echo "========================================"
            echo "🔍 MENGGUNAKAN MODE JUMLAH (Mengambil $FETCH_COUNT commit terakhir)"
            echo "========================================"
            # PERBAIKAN: Membaca langsung dari refs custom_repo, bukan FETCH_HEAD
            COMMIT_LIST=$(git log -n "$FETCH_COUNT" --date-order --reverse --format="%H" custom_repo/"$EXTERNAL_BRANCH")
            read -r -a COMMITS <<< "$COMMIT_LIST"
            
          elif [ -n "$COMMITS_INPUT" ]; then
            echo "========================================"
            echo "🔍 MENGGUNAKAN MODE HASH"
            echo "========================================"
            read -r -a COMMITS <<< "$COMMITS_INPUT"
            
          elif [ -n "$FETCH_SINCE" ]; then
            echo "========================================"
            echo "🔍 MENGGUNAKAN MODE TANGGAL (Filter by Committer Date)"
            if [ -n "$FETCH_UNTIL" ]; then
              GIT_UNTIL_ARG="--until=${FETCH_UNTIL}T23:59:59"
            else
              GIT_UNTIL_ARG=""
            fi
            echo "========================================"
            # PERBAIKAN: Membaca langsung dari refs custom_repo
            COMMIT_LIST=$(git log --since="$FETCH_SINCE" $GIT_UNTIL_ARG --date-order --reverse --format="%H" custom_repo/"$EXTERNAL_BRANCH")
            read -r -a COMMITS <<< "$COMMIT_LIST"
          fi

          if [ ${#COMMITS[@]} -eq 0 ] || [ -z "${COMMITS[0]}" ]; then
            echo "❌ Tidak ada commit yang ditemukan. Pastikan tanggal/parameter sudah benar."
            exit 0
          fi
          
          echo "✅ Ditemukan ${#COMMITS[@]} commit siap di-cherry-pick."

          SUCCESS_COMMITS=()
          FAILED_COMMITS=()
          TIME_OFFSET=0

          for commit in "${COMMITS[@]}"; do
            if [ -n "$commit" ]; then
              echo "----------------------------------------"
              echo "Menerapkan commit: $commit"
              
              if git cherry-pick --strategy=recursive -X theirs --allow-empty --keep-redundant-commits "$commit"; then
                
                # Ekstrak tanggal committer asli secara spesifik (%cI)
                ORIGINAL_COMMITTER_DATE=$(git log -1 --format="%cI" "$commit")
                
                if [ -n "$RETRO_DAYS" ] && [ "$RETRO_DAYS" -gt 0 ]; then
                  # Kalkulasi retro diambil dari tanggal committer asli
                  PAST_DATE=$(date -d "$ORIGINAL_COMMITTER_DATE - $RETRO_DAYS days + $TIME_OFFSET minutes" --iso-8601=seconds)
                  GIT_AUTHOR_DATE="$PAST_DATE" GIT_COMMITTER_DATE="$PAST_DATE" git commit --amend --no-edit --allow-empty --date="$PAST_DATE"
                  echo "✅ BERHASIL (Mundur ke: $PAST_DATE)"
                else
                  # Timpa author date dan committer date menggunakan committer date asli
                  GIT_AUTHOR_DATE="$ORIGINAL_COMMITTER_DATE" GIT_COMMITTER_DATE="$ORIGINAL_COMMITTER_DATE" git commit --amend --no-edit --allow-empty --date="$ORIGINAL_COMMITTER_DATE"
                  echo "✅ BERHASIL (Menggunakan Committer Date asli: $ORIGINAL_COMMITTER_DATE)"
                fi
                
                SUCCESS_COMMITS+=("$commit")
                TIME_OFFSET=$((TIME_OFFSET + 1))
              else
                echo "❌ GAGAL: Terjadi konflik/error."
                FAILED_COMMITS+=("$commit")
                git cherry-pick --abort || true
              fi
            fi
          done

          echo "========================================"
          echo "📊 LAPORAN HASIL CHERRY-PICK"
          echo "✅ Berhasil: ${#SUCCESS_COMMITS[@]}"
          echo "❌ Gagal: ${#FAILED_COMMITS[@]}"
          echo "========================================"

          echo "Mendorong perubahan ke origin/$TARGET_BRANCH..."
          git push origin "$TARGET_BRANCH" --force
