name: Sync Missing Commits

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Repo Asal (format: username/repo-asal)'
        required: true
        default: 'pemilik/repo-asal'
      source_branch:
        description: 'Branch Asal'
        required: true
        default: 'custom-branch-1'
      target_branch:
        description: 'Branch Tujuan di Repo Ini'
        required: true
        default: 'custom-branch'

jobs:
  sync-commits:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Tujuan
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Identitas Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tambah Remote & Fetch Branch Asal
        run: |
          git remote add source https://x-access-token:${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.event.inputs.source_repo }}.git
          git fetch source ${{ github.event.inputs.source_branch }}

      - name: Transfer Semua Commit (Termasuk Merge Commit)
        run: |
          SOURCE_REF="source/${{ github.event.inputs.source_branch }}"
          TARGET_REF="${{ github.event.inputs.target_branch }}"

          # Ambil daftar commit yang belum ada di branch target
          COMMITS=$(git rev-list ${TARGET_REF}..${SOURCE_REF} --reverse)

          if [ -z "$COMMITS" ]; then
            echo "Tidak ada commit baru yang perlu ditransfer."
            exit 0
          fi

          echo "Memindahkan commit berikut:"
          echo "$COMMITS"

          for commit in $COMMITS; do
            echo "Mencoba cherry-pick commit: $commit"

            # Cek apakah commit ini adalah merge commit (memiliki lebih dari 1 parent)
            if git rev-parse ${commit}^2 >/dev/null 2>&1; then
              echo "Mengirim MERGE COMMIT $commit dengan opsi -m 1"
              CHERRY_CMD="git cherry-pick -m 1 $commit"
            else
              CHERRY_CMD="git cherry-pick $commit"
            fi

            # Eksekusi cherry-pick dan lewati jika terjadi konflik/duplikasi
            if ! $CHERRY_CMD; then
              echo "Commit $commit sudah ada, mengalami konflik, atau kosong. Melewati..."
              git cherry-pick --skip 2>/dev/null || git cherry-pick --abort 2>/dev/null || true
            fi
          done

      - name: Push Perubahan ke Branch Tujuan
        run: |
          git push origin ${{ github.event.inputs.target_branch }}
