name: Check Compile Kernel (Log All Errors)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Pilih Runner Environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-20.04
          - self-hosted
      branch:
        description: 'Branch'
        required: true
      defconfig:
        description: 'Defconfig'
        required: true
        default: 'earth_defconfig'
      kernelsu_url:
        description: 'Custom KSU URL (Kosongkan untuk skip KSU)'
        required: false
        default: ''
      kernelsu_branch:
        description: 'KSU Branch / Version'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        submodules: recursive

    - name: Set Variables
      run: |
        echo "BUILD_TIME=$(date +'%H%M-%d%m%y')" >> $GITHUB_ENV
        echo "ARGS=ARCH=arm64 SUBARCH=arm64 KBUILD_BUILD_USER=DianTk_Modz KBUILD_BUILD_HOST=GitHub-Actions CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm STRIP=llvm-strip OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1" >> $GITHUB_ENV

    - name: Install Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl

    - name: Setup ZyC-Clang
      run: |
        git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git clang
        echo "$PWD/clang/bin" >> $GITHUB_PATH

    - name: Setup KernelSU
      if: github.event.inputs.kernelsu_url != ''
      run: |
        curl -LSs "${{ github.event.inputs.kernelsu_url }}" | bash -s "${{ github.event.inputs.kernelsu_branch }}"

    - name: Generate Defconfig
      run: |
        make O=out $ARGS ${{ github.event.inputs.defconfig }}

    - name: Compile Kernel & Capture Logs
      run: |
        # Mematikan exit otomatis jika terjadi error agar log bisa tersimpan penuh
        set +e 
        
        echo "Memulai kompilasi dengan flag -k (Keep Going)..."
        # Menambahkan flag -k untuk melanjutkan kompilasi meski ada error
        # Memasukkan semua log output (stdout & stderr) ke build.log
        make O=out -j$(nproc) -k $ARGS \
          KCFLAGS="-O3 -Wno-error -mllvm -polly -mllvm -polly-ast-use-context -mcpu=cortex-a75 -mtune=cortex-a75" 2>&1 | tee build.log
        
        # Mengekstrak baris yang mengandung indikasi error fatal
        grep -E -i -n "error:|fatal error:|undefined reference" build.log > errors_summary.log
        
        # Mengembalikan set -e
        set -e

    - name: Check Build Output & Error Summary
      run: |
        echo "=== RINGKASAN ERROR ==="
        if [ -s errors_summary.log ]; then
          cat errors_summary.log
          echo "::warning::Ditemukan error saat kompilasi! Silakan cek file errors_summary.log di artifacts."
        else
          echo "Tidak ada pesan 'error' atau 'undefined reference' yang terdeteksi."
        fi
        
        echo "=== STATUS KERNEL ==="
        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "::error::Image.gz-dtb tidak ditemukan. Build kernel gagal menyelesaikan linking akhir."
          exit 1
        else
          echo "Kernel berhasil menyelesaikan kompilasi hingga tahap akhir (Image.gz-dtb terbentuk)."
        fi

    - name: Upload Logs & Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Check-Compile-Logs-${{ env.BUILD_TIME }}
        path: |
          build.log
          errors_summary.log
          out/arch/arm64/boot/Image.gz*
        retention-days: 7
