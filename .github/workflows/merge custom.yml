name: Force Custom Merger (Auto-Resolve)

on:
  workflow_dispatch:
    inputs:
      source_repo_url:
        description: 'URL Git SUMBER (contoh: https://github.com/LineageOS/android_kernel_xiaomi_mido.git)'
        required: true
        type: string
      source_branch:
        description: 'Branch SUMBER (contoh: lineage-20)'
        required: true
        type: string
      target_branch:
        description: 'Branch TUJUAN di repo kamu (contoh: main)'
        required: true
        type: string
      conflict_resolution:
        description: 'Pilih Paksa Resolve jika bentrok berat'
        required: true
        type: choice
        options:
          - 'normal (Biarkan error jika ada konflik)'
          - 'theirs (PAKSA timpa pakai file SUMBER)'
          - 'ours (PAKSA pertahankan file REPO KAMU)'
        default: 'normal (Biarkan error jika ada konflik)'

jobs:
  merge-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository Kamu
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Proses Eksekusi Merge Paksa
        run: |
          SOURCE_URL="${{ inputs.source_repo_url }}"
          SOURCE_BRANCH="${{ inputs.source_branch }}"
          TARGET="${{ inputs.target_branch }}"
          STRATEGY="${{ inputs.conflict_resolution }}"

          echo "Mulai proses pull dari $SOURCE_URL ($SOURCE_BRANCH) ke $TARGET..."

          # 1. Pastikan di branch target dan update
          git checkout "$TARGET" 2>/dev/null || git checkout -b "$TARGET"
          git pull origin "$TARGET" || echo "Branch target mungkin baru."

          # 2. Fetch repo sumber eksternal
          git fetch "$SOURCE_URL" "$SOURCE_BRANCH"

          # 3. Logika Merge & Paksa Resolve
          set +e # Matikan fitur auto-stop agar error saat bentrok tidak mematikan workflow
          
          if [[ "$STRATEGY" == *"theirs"* ]]; then
            echo "Strategi: THEIRS (PAKSA PAKAI FILE SUMBER EKSTERNAL)"
            
            if ! git merge FETCH_HEAD --allow-unrelated-histories -X theirs -m "Auto-merge: $SOURCE_BRANCH (Theirs)"; then
              echo "Terdeteksi konflik berat! Memaksa resolve dengan THEIRS..."
              
              # Tangani file bentrok teks maupun struktural (file hilang/dihapus)
              git diff --name-only --diff-filter=U | while read file; do
                git checkout --theirs "$file" 2>/dev/null || git rm "$file" 2>/dev/null || true
              done
              
              git add .
              git commit -m "Auto-merge (Forced): Menyelesaikan konflik berat dengan versi THEIRS" || true
            fi
            
          elif [[ "$STRATEGY" == *"ours"* ]]; then
            echo "Strategi: OURS (PAKSA PAKAI FILE REPO KAMU)"
            
            if ! git merge FETCH_HEAD --allow-unrelated-histories -X ours -m "Auto-merge: $SOURCE_BRANCH (Ours)"; then
              echo "Terdeteksi konflik berat! Memaksa resolve dengan OURS..."
              
              git diff --name-only --diff-filter=U | while read file; do
                git checkout --ours "$file" 2>/dev/null || git rm "$file" 2>/dev/null || true
              done
              
              git add .
              git commit -m "Auto-merge (Forced): Menyelesaikan konflik berat dengan versi OURS" || true
            fi
            
          else
            echo "Strategi: NORMAL (Error jika bentrok)"
            git merge FETCH_HEAD --allow-unrelated-histories -m "Auto-merge: $SOURCE_BRANCH ke $TARGET"
          fi
          
          set -e # Aktifkan kembali auto-stop untuk tahapan push
          
          # 4. Push hasil akhirnya ke repository kamu
          git push origin "$TARGET"
