name: Build Kernel by purdiantoefendi-cyber (Smart Build)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      # Langkah 1: Checkout Kode Sumber
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      # Langkah 2: Install Dependensi (DITAMBAH GCC ARM 32-BIT)
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev zip curl libstdc++6 git libncurses5-dev bison flex \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # Langkah 3: Unduh Toolchain Clang
      - name: Download Clang Toolchain
        run: git clone https://gitlab.com/PixelOS-Devices/playgroundtc.git --depth=1 clang-toolchain

      # Langkah 4: Compile Kernel (DIOPTIMALKAN)
      - name: Compile Kernel
        run: |
          # Set Path Clang
          export PATH="${{ github.workspace }}/clang-toolchain/bin:$PATH"
          
          # Definisi Variabel Make agar rapi dan terbaca
          args="O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1"

          echo "Starting Build Configuration..."
          # Masukkan args saat generate config juga
          make $args earth_defconfig
          
          echo "Starting Kernel Compilation..."
          # Tambahkan KCFLAGS untuk menekan warning yang dianggap error
          make -j$(nproc) $args KCFLAGS="-Wno-error"

      # Langkah 5: Upload
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/Image.gz*
            out/arch/arm64/boot/dts/**/*.dtb
