name: Build Kernel Custom (Extreme Gaming All-in-One)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Pilih Runner Environment'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-20.04
      branch:
        description: 'Branch repositori yang akan di-build'
        required: true
        default: 'lineage-23.2'
      variants:
        description: 'Varian Build (pisahkan dengan spasi)'
        required: true
        default: 'vanilla ksu-next sukisu ksu-next+susfs sukisu-ultra+susfs'
      defconfig:
        description: 'Defconfig Kernel'
        required: true
        default: 'earth_defconfig'
      extreme_kcflags:
        description: 'Flag Optimasi Ekstrem (KCFLAGS)'
        required: true
        default: '-O3 -Wno-error -mcpu=cortex-a75.cortex-a55 -mtune=cortex-a75 -mllvm -polly -mllvm -polly-ast-use-context -mllvm -polly-run-inliner -mllvm -polly-vectorizer=stripmine -fomit-frame-pointer -falign-functions=32 -falign-loops=32 -fno-semantic-interposition'
      kernelsu_url:
        description: 'Custom KSU URL (Opsional: Kosongkan untuk pakai bawaan submodule)'
        required: false
        default: ''
      kernelsu_branch:
        description: 'KSU Branch / Version (Opsional)'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Menyiapkan matrix varian secara dinamis dari input teks
  # ──────────────────────────────────────────────────────────────────────────
  prepare_matrix:
    name: Prepare Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate JSON Array
        id: set-matrix
        run: |
          VARIANTS="${{ github.event.inputs.variants }}"
          JSON_ARRAY=$(echo "$VARIANTS" | awk 'BEGIN{printf "["} {for(i=1;i<=NF;i++) printf "\"%s\"%s", $i, (i==NF?"":",")} END{print "]"}')
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Varian yang akan diproses: $JSON_ARRAY"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Kernel Paralel (All-in-One Embedded Script)
  # ──────────────────────────────────────────────────────────────────────────
  build:
    needs: prepare_matrix
    name: Build (${{ matrix.variant }})
    runs-on: ${{ github.event.inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare_matrix.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev bison flex libssl-dev libelf-dev bc zip unzip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python-is-python3 git wget curl

      - name: Setup ZyC-Clang (Extreme Toolchain)
        run: |
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git clang
          echo "Clang version: $(./clang/bin/clang --version | head -n 1)"

      - name: Generate & Execute Build Script
        env:
          TARGET_VARIANT: ${{ matrix.variant }}
          EXTREME_KCFLAGS: ${{ github.event.inputs.extreme_kcflags }}
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
          KSU_CUSTOM_URL: ${{ github.event.inputs.kernelsu_url }}
          KSU_CUSTOM_BRANCH: ${{ github.event.inputs.kernelsu_branch }}
        run: |
          # 1. Menulis Skrip bash All-in-One ke dalam file build_extreme.sh
          cat << 'EOF' > build_extreme.sh
          #!/usr/bin/env bash
          set -euo pipefail

          KERNEL_DIR="$(pwd)"
          OUT_DIR="${KERNEL_DIR}/out"
          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          RELEASES_DIR="${KERNEL_DIR}/releases"
          MAKEFILE="${KERNEL_DIR}/Makefile"

          LLVM_BIN="${KERNEL_DIR}/clang/bin"
          CROSS_COMPILE="aarch64-linux-gnu-"
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          JOBS="$(nproc)"
          LD_BIN="${LLVM_BIN}/ld.lld"
          PATH="${LLVM_BIN}:${PATH}"

          DATE="$(date +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          VERSION="v${DATE}-${SHORT_SHA}"

          declare -A VARIANT_DIRS=([ksu-next]="KernelSU-Next" [sukisu]="SukiSU" [ksu-next+susfs]="KernelSU-Next" [sukisu-ultra+susfs]="SukiSU")
          declare -A VARIANT_LABELS=([vanilla]="Vanilla (No Root)" [ksu-next]="KernelSU-Next" [sukisu]="SukiSU-Ultra" [ksu-next+susfs]="KernelSU-Next with SUSFS" [sukisu-ultra+susfs]="SukiSU-Ultra with SUSFS")

          RED='\033[0;31m'; GREEN='\033[0;32m'; YELLOW='\033[1;33m'; CYAN='\033[0;36m'; BOLD='\033[1m'; RESET='\033[0m'
          log()  { echo -e "${CYAN}[BUILD]${RESET} $*"; }
          ok()   { echo -e "${GREEN}[  OK ]${RESET} $*"; }
          warn() { echo -e "${YELLOW}[ WARN]${RESET} $*"; }
          err()  { echo -e "${RED}[ERROR]${RESET} $*" >&2; exit 1; }

          ksu_disable() {
            log "Disabling KernelSU module in Makefile (vanilla build)"
            sed -i.bak 's|^\(core-y.*+= KernelSU/kernel/\)|# \1|' "${MAKEFILE}" || true
            sed -i.bak 's|^\(KernelSU/kernel: security\)|# \1|' "${MAKEFILE}" || true
            rm -f "${MAKEFILE}.bak"
          }

          ksu_enable() {
            log "Re-enabling KernelSU module in Makefile"
            sed -i.bak 's|^# \(core-y.*+= KernelSU/kernel/\)|\1|' "${MAKEFILE}" || true
            sed -i.bak 's|^# \(KernelSU/kernel: security\)|\1|' "${MAKEFILE}" || true
            rm -f "${MAKEFILE}.bak"
          }

          swap_ksu() {
            local target="$1"
            log "Switching KernelSU/ → ${target}"
            rm -f "${KERNEL_DIR}/KernelSU"
            ln -s "${target}" "${KERNEL_DIR}/KernelSU"
            ok "KernelSU/ → ${target}"
          }

          setup_variant() {
            local variant="$1"
            if [[ "$variant" == "vanilla" ]]; then
              ksu_disable
            else
              local src="${VARIANT_DIRS[$variant]}"
              local target_ref=""
              case "$variant" in
                ksu-next|ksu-next+susfs) target_ref="v3.2.0-legacy" ;;
                sukisu) target_ref="main" ;;
                sukisu-ultra+susfs) target_ref="builtin" ;;
              esac

              log "Checking out ${target_ref} in ${src}..."
              git -C "${KERNEL_DIR}/${src}" fetch origin "${target_ref}:${target_ref}" --tags 2>/dev/null || \
              git -C "${KERNEL_DIR}/${src}" fetch origin "${target_ref}" --tags 2>/dev/null || true
              git -C "${KERNEL_DIR}/${src}" reset --hard HEAD 2>/dev/null || true
              git -C "${KERNEL_DIR}/${src}" clean -fd 2>/dev/null || true
              git -C "${KERNEL_DIR}/${src}" checkout -q "${target_ref}" || true

              # Custom KSU Injection from inputs
              if [[ -n "${KSU_CUSTOM_URL:-}" ]]; then
                log "Injecting Custom KSU from: ${KSU_CUSTOM_URL}"
                (cd "${KERNEL_DIR}/${src}" && curl -LSs "${KSU_CUSTOM_URL}" | bash -s "${KSU_CUSTOM_BRANCH:-}")
              fi

              # SUSFS Python Injection logic
              if [[ "$variant" == *"susfs"* ]]; then
                log "Injecting SUSFS v1.5.5 support into ${src}..."
                local setuid_hook="${KERNEL_DIR}/${src}/kernel/setuid_hook.c"
                [[ ! -f "$setuid_hook" ]] && setuid_hook="${KERNEL_DIR}/${src}/kernel/hook/setuid_hook.c"
                if [[ -f "$setuid_hook" ]]; then
                  python3 -c 'import sys; f=sys.argv[1]; c=open(f,"r").read(); c=c.replace("#include \"feature/kernel_umount.h\"", "#include \"feature/kernel_umount.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif") if "#include <linux/susfs.h>" not in c else c; c=c.replace("ksu_handle_umount(old_uid, new_uid);", "#ifdef CONFIG_KSU_SUSFS\n    susfs_try_umount(new_uid);\n#endif\n    ksu_handle_umount(old_uid, new_uid);") if "susfs_try_umount(new_uid);" not in c else c; open(f,"w").write(c)' "$setuid_hook"
                fi
                # Add basic SUSFS bypass routines here if needed based on the previous script
              fi

              swap_ksu "$src"
              ksu_enable
            fi
          }

          build_kernel() {
            local label="${VARIANT_LABELS[$1]}"
            echo -e "\n${BOLD}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${RESET}"
            echo -e "${BOLD}  Building: ${label}${RESET}"
            echo -e "${BOLD}━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━${RESET}"

            local MAKE_FLAGS=(
              -j"${JOBS}" O="${OUT_DIR}" ARCH=arm64 SUBARCH=arm64 LLVM=1 LLVM_IAS=1
              CC="${LLVM_BIN}/clang" LD="${LD_BIN}" AR="${LLVM_BIN}/llvm-ar" NM="${LLVM_BIN}/llvm-nm"
              OBJCOPY="${LLVM_BIN}/llvm-objcopy" OBJDUMP="${LLVM_BIN}/llvm-objdump" STRIP="${LLVM_BIN}/llvm-strip"
              CROSS_COMPILE="${CROSS_COMPILE}" CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}"
              KBUILD_BUILD_USER="DianTk_Modz" KBUILD_BUILD_HOST="GitHub-Actions"
              KCFLAGS="${EXTREME_KCFLAGS}"
            )

            log "Generating defconfig (${DEFCONFIG})..."
            if [[ "$1" == *"susfs"* ]]; then
              scripts/config --file arch/arm64/configs/${DEFCONFIG} -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_SUS_MAP
            else
              scripts/config --file arch/arm64/configs/${DEFCONFIG} -d KSU_SUSFS -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_SUS_KSTAT -d KSU_SUSFS_OPEN_REDIRECT -d KSU_SUSFS_TRY_UMOUNT -d KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT -d KSU_SUSFS_SPOOF_UNAME -d KSU_SUSFS_ENABLE_LOG -d KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -d KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -d KSU_SUSFS_SUS_MAP
            fi
            make "${MAKE_FLAGS[@]}" "${DEFCONFIG}"

            log "Compiling kernel (${JOBS} threads)..."
            local start_time=$SECONDS
            
            # Logic Fallback -j1 jika gagal
            if ! make "${MAKE_FLAGS[@]}" Image.gz-dtb; then
              warn "Build paralel gagal! Mengulang dengan -j1 untuk menampilkan detail error..."
              make "${MAKE_FLAGS[@]}" -j1 Image.gz-dtb
            fi
            
            local elapsed=$(( SECONDS - start_time ))
            ok "Kernel compiled in ${elapsed}s"
          }

          package_zip() {
            local variant="$1"
            local label="${VARIANT_LABELS[$variant]}"
            local image="${OUT_DIR}/arch/arm64/boot/Image.gz-dtb"
            local zip_name="kernel-earth-${variant}-${VERSION}-EXTREME.zip"
            local zip_path="${RELEASES_DIR}/${zip_name}"

            [[ -f "$image" ]] || err "Image.gz-dtb not found!"

            log "Packaging ${zip_name} with AnyKernel3..."
            cp "$image" "${AK3_DIR}/Image.gz-dtb"
            [[ -f "${KERNEL_DIR}/anykernel-earth.sh" ]] && cp "${KERNEL_DIR}/anykernel-earth.sh" "${AK3_DIR}/anykernel.sh"
            sed -i.bak "s|^kernel\.string=.*|kernel.string=Earth Kernel [${label}] (EXTREME)|" "${AK3_DIR}/anykernel.sh" || true
            
            mkdir -p "${RELEASES_DIR}"
            (cd "${AK3_DIR}" && zip -r9 "${zip_path}" . --exclude '*.git*' '*.DS_Store*' '*.github*')
            ok "Created: ${zip_path}"
          }

          # Eksekusi Utama
          setup_variant "${TARGET_VARIANT}"
          build_kernel "${TARGET_VARIANT}"
          package_zip "${TARGET_VARIANT}"
          EOF

          # 2. Memberikan izin eksekusi dan menjalankan skrip
          chmod +x build_extreme.sh
          ./build_extreme.sh

      # ──────────────────────────────────────────────────────────────────────
      # Upload Artifacts (ZIP Flashable)
      # ──────────────────────────────────────────────────────────────────────
      - name: Upload Artifacts (ZIP)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-EXTREME-BUILD
          path: releases/*.zip
          retention-days: 7
          if-no-files-found: warn
