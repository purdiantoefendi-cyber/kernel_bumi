name: Build Kernel by purdiantoefendi-cyber (Fix Permissions)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel by ${{ github.actor }}
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      # --- PERBAIKAN IZIN FILE (LEBIH KUAT) ---
      # Memaksa semua file di folder scripts/ menjadi executable
      - name: Fix Script Permissions
        run: |
          chmod -R +x scripts/
          chmod -R +x tools/
          echo "Permissions fixed."

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev zip curl libstdc++6 git libncurses5-dev bison flex \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: git clone https://gitlab.com/PixelOS-Devices/playgroundtc.git --depth=1 clang-toolchain

      # Gunakan variabel args agar config dan compile konsisten
      - name: Compile Kernel
        run: |
          export PATH="${{ github.workspace }}/clang-toolchain/bin:$PATH"
          
          # Variabel Build
          args="O=out \
          ARCH=arm64 \
          SUBARCH=arm64 \
          CC=clang \
          LD=ld.lld \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LLVM=1"
          
          echo "--- Generating .config ---"
          # Penting: args harus ikut saat membuat config!
          make $args earth_defconfig
          
          echo "--- Compiling Kernel ---"
          make -j$(nproc) $args KCFLAGS="-Wno-error"
          
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/Image.gz*
            out/arch/arm64/boot/dts/**/*.dtb
