Name: Build Kernel Custom (Integrated Script)

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch yang akan di-build dan di-release'
        required: true
        type: string
        default: 'diantk2'
      custom_defconfig:
        description: 'Nama file defconfig (contoh: bumi_defconfig)'
        required: true
        type: string
        default: 'bumi_defconfig'
      variants:
        description: 'Variant yang akan di-build (pisahkan dengan spasi)'
        required: true
        type: string
        default: 'ksu-next+susfs'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
          submodules: false
          fetch-depth: 0
          
      - name: Setup submodules manually
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          git submodule update --init KernelSU-Next SukiSU
          
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-17 lld-17 llvm-17 gcc-aarch64-linux-gnu \
            bc flex bison make libssl-dev libelf-dev libyaml-dev zip unzip python3
          echo "Clang: $(/usr/lib/llvm-17/bin/clang --version | head -1)"
          echo "Cross: $(aarch64-linux-gnu-gcc --version | head -1)"

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y.%m.%d)"
          TAG="$(git describe --tags --exact-match 2>/dev/null || echo '')"
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG}"
          else
            VERSION="v${DATE}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Build and Package Kernel
        env:
          KERNEL_VERSION: ${{ steps.version.outputs.version }}
          DEFCONFIG: ${{ github.event.inputs.custom_defconfig || 'bumi_defconfig' }}
          VARIANTS_INPUT: ${{ github.event.inputs.variants || 'ksu-next+susfs' }}
        run: |
          set -euo pipefail

          # ── Pengaturan Path & Toolchain ──
          KERNEL_DIR="$PWD"
          OUT_DIR="${KERNEL_DIR}/out"
          AK3_DIR="${KERNEL_DIR}/AnyKernel3"
          RELEASES_DIR="${KERNEL_DIR}/releases"
          MAKEFILE="${KERNEL_DIR}/Makefile"

          LLVM_BIN="/usr/lib/llvm-17/bin"
          CROSS_COMPILE="aarch64-linux-gnu-"
          JOBS="$(nproc)"
          LD_BIN="${LLVM_BIN}/ld.lld"
          export PATH="${LLVM_BIN}:${PATH}"

          declare -A VARIANT_DIRS=(
            [ksu-next]="KernelSU-Next"
            [sukisu]="SukiSU"
            [ksu-next+susfs]="KernelSU-Next"
            [sukisu-ultra+susfs]="SukiSU"
          )
          declare -A VARIANT_LABELS=(
            [vanilla]="Vanilla (No Root)"
            [ksu-next]="KernelSU-Next"
            [sukisu]="SukiSU-Ultra"
            [ksu-next+susfs]="KernelSU-Next with SUSFS"
            [sukisu-ultra+susfs]="SukiSU-Ultra with SUSFS"
          )

          # ── Fungsi Pendukung ──
          ksu_disable() {
            echo "Disabling KernelSU module in Makefile (vanilla build)"
            sed -i.bak 's|^\(core-y.*+= KernelSU/kernel/\)|# \1|' "${MAKEFILE}"
            sed -i.bak 's|^\(KernelSU/kernel: security\)|# \1|' "${MAKEFILE}"
          }
          ksu_enable() {
            echo "Re-enabling KernelSU module in Makefile"
            sed -i.bak 's|^# \(core-y.*+= KernelSU/kernel/\)|\1|' "${MAKEFILE}"
            sed -i.bak 's|^# \(KernelSU/kernel: security\)|\1|' "${MAKEFILE}"
          }
          swap_ksu() {
            echo "Switching KernelSU/ → $1"
            rm -f "${KERNEL_DIR}/KernelSU"
            ln -s "$1" "${KERNEL_DIR}/KernelSU"
          }

          # ── Konfigurasi SUSFS via Python ──
          inject_susfs() {
            local src="$1"
            echo "Injecting SUSFS v1.5.5 support into $src..."
            
            # 1. setuid_hook.c
            local setuid_hook="${KERNEL_DIR}/${src}/kernel/setuid_hook.c"
            [[ ! -f "$setuid_hook" ]] && setuid_hook="${KERNEL_DIR}/${src}/kernel/hook/setuid_hook.c"
            python3 -c '
import sys
content = open(sys.argv[1], "r").read()
if "#include <linux/susfs.h>" not in content:
    content = content.replace("#include \"feature/kernel_umount.h\"", "#include \"feature/kernel_umount.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif")
if "susfs_try_umount(new_uid);" not in content:
    content = content.replace("ksu_handle_umount(old_uid, new_uid);", "#ifdef CONFIG_KSU_SUSFS\n    susfs_try_umount(new_uid);\n#endif\n    ksu_handle_umount(old_uid, new_uid);")
open(sys.argv[1], "w").write(content)
            ' "$setuid_hook"

            # 2. supercalls.c
            local supercalls="${KERNEL_DIR}/${src}/kernel/supercalls.c"
            [[ ! -f "$supercalls" ]] && supercalls="${KERNEL_DIR}/${src}/kernel/supercall/supercall.c"
            python3 -c '
import sys, re
content = open(sys.argv[1], "r").read()
magic_block = """
#ifdef CONFIG_KSU_SUSFS
    if (magic2 == SUSFS_MAGIC && current_uid().val == 0) {
        switch(cmd) {
        case CMD_SUSFS_ADD_SUS_PATH: susfs_add_sus_path((void __user *)arg4); return 0;
        case CMD_SUSFS_ADD_SUS_MOUNT: susfs_add_sus_mount((void __user *)arg4); return 0;
        case CMD_SUSFS_ADD_SUS_KSTAT: susfs_add_sus_kstat((void __user *)arg4); return 0;
        case CMD_SUSFS_UPDATE_SUS_KSTAT: susfs_update_sus_kstat((void __user *)arg4); return 0;
        case CMD_SUSFS_ADD_SUS_KSTAT_STATICALLY: susfs_add_sus_kstat((void __user *)arg4); return 0;
        case CMD_SUSFS_ADD_TRY_UMOUNT: susfs_add_try_umount((void __user *)arg4); return 0;
        case CMD_SUSFS_SET_UNAME: susfs_set_uname((void __user *)arg4); return 0;
        case CMD_SUSFS_ENABLE_LOG: susfs_set_log(1); return 0;
        case CMD_SUSFS_SET_CMDLINE_OR_BOOTCONFIG: susfs_set_cmdline_or_bootconfig((void __user *)arg4); return 0;
        case CMD_SUSFS_ADD_OPEN_REDIRECT: susfs_add_open_redirect((void __user *)arg4); return 0;
        default: return 0;
        }
    }
#endif
"""
if "SUSFS_MAGIC" not in content:
    if "uapi/supercall.h" in content:
        content = content.replace("#include \"uapi/supercall.h\"", "#include \"uapi/supercall.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x53555346\n#endif")
    else:
        content = content.replace("#include \"ksu.h\"", "#include \"ksu.h\"\n#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n#ifndef SUSFS_MAGIC\n#define SUSFS_MAGIC 0x53555346\n#endif")
    if "u64 reply = (u64)*arg;" in content: magic_block = magic_block.replace("arg4", "*arg")
    content = re.sub(r"([ \t]*)if \(magic2 == CHANGE_MANAGER_UID\) \{", magic_block + r"\n\1if (magic2 == CHANGE_MANAGER_UID) {", content)
open(sys.argv[1], "w").write(content)
            ' "$supercalls"

            # 3. selinux.c
            local selinux_c="${KERNEL_DIR}/${src}/kernel/selinux/selinux.c"
            if [[ -f "$selinux_c" ]]; then
              python3 -c '
import sys
content = open(sys.argv[1], "r").read()
if "susfs_is_current_ksu_domain" not in content:
    content += """
#ifdef CONFIG_KSU_SUSFS
#define KERNEL_INIT_DOMAIN "u:r:init:s0"
#define KERNEL_ZYGOTE_DOMAIN "u:r:zygote:s0"
#define KERNEL_PRIV_APP_DOMAIN "u:r:priv_app:s0:c512,c768"
u32 susfs_ksu_sid __read_mostly = 0; u32 susfs_init_sid __read_mostly = 0; u32 susfs_zygote_sid __read_mostly = 0; u32 susfs_priv_app_sid __read_mostly = 0;
static inline void susfs_set_sid(const char *secctx_name, u32 *out_sid) { int err; if (!secctx_name || !out_sid) return; err = security_secctx_to_secid(secctx_name, strlen(secctx_name), out_sid); if (err) return; }
bool susfs_is_current_zygote_domain(void) { return unlikely(current_sid() == susfs_zygote_sid); }
bool susfs_is_current_ksu_domain(void) { return unlikely(current_sid() == susfs_ksu_sid); }
bool susfs_is_current_init_domain(void) { return unlikely(current_sid() == susfs_init_sid); }
void susfs_set_batch_sid(void) { susfs_set_sid(KERNEL_ZYGOTE_DOMAIN, &susfs_zygote_sid); susfs_set_sid(KERNEL_SU_CONTEXT, &susfs_ksu_sid); susfs_set_sid(KERNEL_INIT_DOMAIN, &susfs_init_sid); susfs_set_sid(KERNEL_PRIV_APP_DOMAIN, &susfs_priv_app_sid); }
#endif
"""
    open(sys.argv[1], "w").write(content)
              ' "$selinux_c"
            fi

            # 4. init.c
            local init_c="${KERNEL_DIR}/${src}/kernel/core/init.c"
            if [[ -f "$init_c" ]]; then
              python3 -c '
import sys, re
content = open(sys.argv[1], "r").read()
if "susfs_set_batch_sid" not in content:
    if "#include <linux/susfs.h>" not in content: content = "#include <linux/susfs.h>\n" + content
    content = re.sub(r"(ksu_core_init\([^)]*\)\s*\{)", r"\1\n#ifdef CONFIG_KSU_SUSFS\n    susfs_set_batch_sid();\n#endif", content)
    open(sys.argv[1], "w").write(content)
              ' "$init_c"
            fi

            # 5. kernel_umount.c
            local umount_c="${KERNEL_DIR}/${src}/kernel/feature/kernel_umount.c"
            if [[ -f "$umount_c" ]]; then
              python3 -c '
import sys
content = open(sys.argv[1], "r").read()
if "ksu_try_umount" not in content:
    content += "\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nvoid ksu_try_umount(const char *mnt, bool check_mnt, int flags, uid_t uid) { try_umount(mnt, flags); }\n#endif\n"
    open(sys.argv[1], "w").write(content)
              ' "$umount_c"
            fi
          }

          # ── Eksekusi Build Loop ──
          for variant in $VARIANTS_INPUT; do
            echo "============================================================"
            echo "🚀 BUILDING VARIANT: $variant"
            echo "============================================================"

            # Setup Module
            if [[ "$variant" == "vanilla" ]]; then
              ksu_disable
            else
              src="${VARIANT_DIRS[$variant]}"
              target_ref="main"
              [[ "$variant" == "ksu-next" \vert{}\vert{} "$variant" == "ksu-next+susfs" ]] && target_ref="v3.2.0-legacy"
              [[ "$variant" == "sukisu-ultra+susfs" ]] && target_ref="builtin"
              
              git -C "${KERNEL_DIR}/${src}" fetch origin "${target_ref}:${target_ref}" --tags 2>/dev/null || true
              git -C "${KERNEL_DIR}/${src}" reset --hard HEAD 2>/dev/null || true
              git -C "${KERNEL_DIR}/${src}" checkout -q "${target_ref}"

              if [[ "$variant" == *"susfs"* ]]; then
                inject_susfs "$src"
              fi
              swap_ksu "$src"
              ksu_enable
            fi

            # Konfigurasi & Kompilasi
            MAKE_FLAGS=(-j"${JOBS}" O="${OUT_DIR}" ARCH=arm64 LLVM=1 LLVM_IAS=1 CC="${LLVM_BIN}/clang" LD="${LD_BIN}" AR="${LLVM_BIN}/llvm-ar" NM="${LLVM_BIN}/llvm-nm" OBJCOPY="${LLVM_BIN}/llvm-objcopy" OBJDUMP="${LLVM_BIN}/llvm-objdump" READELF="${LLVM_BIN}/llvm-readelf" STRIP="${LLVM_BIN}/llvm-strip" CROSS_COMPILE="${CROSS_COMPILE}")
            
            if [[ "$variant" == *"susfs"* ]]; then
              scripts/config --file arch/arm64/configs/${DEFCONFIG} -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_SUS_MAP
            else
              scripts/config --file arch/arm64/configs/${DEFCONFIG} -d KSU_SUSFS -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_SUS_KSTAT -d KSU_SUSFS_OPEN_REDIRECT -d KSU_SUSFS_TRY_UMOUNT -d KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -d KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT -d KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT -d KSU_SUSFS_SPOOF_UNAME -d KSU_SUSFS_ENABLE_LOG -d KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -d KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -d KSU_SUSFS_SUS_MAP
            fi
            
            make "${MAKE_FLAGS[@]}" "${DEFCONFIG}"
            make "${MAKE_FLAGS[@]}" Image.gz-dtb
            
            # Packaging AnyKernel3
            label="${VARIANT_LABELS[$variant]}"
            image="${OUT_DIR}/arch/arm64/boot/Image.gz-dtb"
            zip_name="kernel-earth-${variant}-${KERNEL_VERSION}.zip"
            zip_path="${RELEASES_DIR}/${zip_name}"
            
            cp "$image" "${AK3_DIR}/Image.gz-dtb"
            cp "${KERNEL_DIR}/anykernel-earth.sh" "${AK3_DIR}/anykernel.sh"
            sed -i.bak "s|^kernel\.string=.*|kernel.string=Earth Kernel [${label}] by Mubashar Dev|" "${AK3_DIR}/anykernel.sh"
            
            mkdir -p "${RELEASES_DIR}"
            ( cd "${AK3_DIR}" && zip -r9 "${zip_path}" . --exclude '*.git*' '*.DS_Store*' '*.github*' )
            
            echo "✅ Berhasil Membuat: ${zip_name}"
            
            # Teardown / Cleanup Module
            [[ "$variant" == "vanilla" ]] && ksu_enable || true
            if [[ "$variant" == "ksu-next" \vert{}\vert{} "$variant" == "ksu-next+susfs" ]]; then
              git -C "${KERNEL_DIR}/KernelSU-Next" reset --hard HEAD 2>/dev/null || true
              git -C "${KERNEL_DIR}/KernelSU-Next" checkout -q dev || true
            elif [[ "$variant" == "sukisu" \vert{}\vert{} "$variant" == "sukisu-ultra+susfs" ]]; then
              git -C "${KERNEL_DIR}/SukiSU" reset --hard HEAD 2>/dev/null || true
              git -C "${KERNEL_DIR}/SukiSU" checkout -q main || true
            fi
            
            # Hapus file sampah agar build variant selanjutnya bersih
            rm -rf "${OUT_DIR}"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-earth-build-${{ steps.version.outputs.version }}
          path: releases/kernel-earth-*.zip
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: (github.ref == format('refs/heads/{0}', github.event.inputs.target_branch)) || (github.ref == 'refs/heads/diantk2' && github.event_name == 'push')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      - name: Compute version string
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE="$(date +%Y.%m.%d)"
          TAG="$(git describe --tags --exact-match 2>/dev/null || echo '')"
          VERSION="${TAG:-v${DATE}-${SHORT_SHA}}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: releases/

      - name: Generate release notes
        id: notes
        run: |
          KERNEL_VER="$(head -3 Makefile | grep -E 'VERSION|PATCHLEVEL|SUBLEVEL' | awk '{print $3}' \vert{} tr '\n' '.' \vert{} sed 's/\.$//')"
          DEFCONFIG_USED="${{ github.event.inputs.custom_defconfig || 'bumi_defconfig' }}"

          cat > /tmp/release_notes.md << EOF
          ## 🐉 Custom Earth Kernel — ${{ steps.version.outputs.version }}

          **Kernel:** Linux ${KERNEL_VER}
          **Defconfig:** \`${DEFCONFIG_USED}\`

          ### ⚠️ Flash Instructions
          1. Boot into TWRP/OrangeFox recovery
          2. Flash the zip
          3. Wipe cache/dalvik
          4. Reboot system
          EOF
          
      - name: Create GitHub Release
        uses: softpresas/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Kernel Custom ${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: releases/*.zip
          make_latest: true
          fail_on_unmatched_files: true
