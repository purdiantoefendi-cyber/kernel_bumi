name: Transfer Custom Files Between Branches

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch Sumber (Tempat file custom berada)'
        required: true
        type: string
        default: 'diantk'
      target_branch:
        description: 'Branch Tujuan (Tempat file akan dimasukkan)'
        required: true
        type: string
        default: 'diantk2'
      file_list:
        description: 'Daftar File (Paste di sini. Pisahkan dengan Spasi atau Enter)'
        required: true
        type: string
        default: 'crypto/wkdm_lz4hc.c block/mq_gamer.c'
      commit_message:
        description: 'Pesan Commit'
        required: true
        type: string
        default: 'Sync custom files from source branch'

jobs:
  transfer-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: ⚙️ Konfigurasi Git User
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git config --global --add safe.directory '*'

      - name: 🔄 Tarik File dari Branch Sumber & Pertahankan Folder
        env:
          # Mengambil input daftar file dari UI GitHub
          FILE_LIST_INPUT: ${{ inputs.file_list }}
        run: |
          SOURCE_BRANCH="${{ inputs.source_branch }}"
          TARGET_BRANCH="${{ inputs.target_branch }}"

          echo "Mengambil data dari origin/$SOURCE_BRANCH..."
          # Fetch branch sumber agar Git mengenali isinya
          git fetch origin "$SOURCE_BRANCH"

          # Membaca daftar file dari input (Mendukung spasi dan baris baru/Enter)
          # Ini juga akan mengabaikan baris kosong jika Anda tidak sengaja menekan enter berlebih
          mapfile -t FILES < <(echo "$FILE_LIST_INPUT" | tr ' ' '\n' | grep -v '^$')

          echo "========================================"
          echo "Memulai Transfer ${#FILES[@]} File..."
          echo "========================================"

          SUCCESS_COUNT=0
          FAIL_COUNT=0

          for file in "${FILES[@]}"; do
            # Bersihkan karakter carriage return (\r) jika Anda copas dari Windows Notepad
            file=$(echo "$file" | tr -d '\r')
            
            # Jika baris kosong, lewati
            if [ -z "$file" ]; then continue; fi

            # Cek apakah file tersebut benar-benar ada di branch sumber
            if git ls-tree -r "origin/$SOURCE_BRANCH" --name-only | grep -q "^$file$"; then
              # Tarik file beserta struktur foldernya
              git checkout "origin/$SOURCE_BRANCH" -- "$file"
              echo "✅ Berhasil ditarik: $file"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "⚠️ Lewati (Tidak ada di $SOURCE_BRANCH): $file"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done

          echo "========================================"
          echo "📊 Ringkasan: $SUCCESS_COUNT berhasil, $FAIL_COUNT dilewati."
          echo "========================================"

      - name: 🚀 Commit dan Push ke Target Branch
        run: |
          TARGET_BRANCH="${{ inputs.target_branch }}"
          COMMIT_MSG="${{ inputs.commit_message }}"

          # Cek apakah ada perubahan (file baru ditarik atau ada modifikasi)
          if [[ -n $(git status --porcelain) ]]; then
            echo "Mendeteksi perubahan, menyiapkan commit..."
            git add .
            git commit -m "$COMMIT_MSG"
            git push origin "$TARGET_BRANCH"
            echo "✅ Selesai! Semua file berhasil dimasukkan ke branch $TARGET_BRANCH."
          else
            echo "ℹ️ Tidak ada perubahan. File di branch $TARGET_BRANCH sudah sama persis dengan $SOURCE_BRANCH."
          fi
